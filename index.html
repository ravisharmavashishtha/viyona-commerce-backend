<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viyona Designs — Studio Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0A0D14;
      --card-bg: rgba(22, 27, 38, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-light: #F3E5AB;
      --text-muted: #9CA3AF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
      color: #F9FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--card-border);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .contact-link {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E5E7EB;
      text-decoration: none;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .contact-link:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✨ Viyona Designs ✨</div>
    <h1>Direct Studio Portal</h1>
    <p>Our direct checkout pipeline is currently undergoing scheduled maintenance and upgrades. Direct orders are temporarily offline.</p>
    <a href="https://instagram.com/viyonadesigns" target="_blank" class="contact-link">
      Connect on Instagram @viyonadesigns ↗
    </a>
  </div>
</body>
</html>
